<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Shared defaults first, then styles for each UI area. -->
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/toolbar.css" />
    <link rel="stylesheet" href="/board.css" />
    <link rel="stylesheet" href="/cards.css" />
    <link rel="stylesheet" href="/details.css" />
  </head>
  <body>
    <div class="top">
      <header class="toolbar">
        <span id="summary" class="summary" aria-live="polite"></span>
        <div class="filter">
          View
          <details id="layout" class="multi-select">
            <summary><span class="multi-select-value">Kanban</span></summary>
            <div class="multi-select-menu" role="radiogroup" aria-label="Board view">
              <div class="multi-select-option"><label><input type="radio" name="layout" value="kanban" checked />Kanban</label></div>
              <div class="multi-select-option"><label><input type="radio" name="layout" value="project" />Project</label></div>
            </div>
          </details>
        </div>
        <div class="filter">
          Projects
          <details id="filter-repo" class="multi-select">
            <summary><span class="multi-select-value">All</span></summary>
            <div class="multi-select-menu" role="group" aria-label="Projects">
              <div class="multi-select-options"></div>
              <button type="button" class="link-button multi-select-clear">Show all</button>
            </div>
          </details>
        </div>
        <div class="filter">
          Source
          <details id="filter-source" class="multi-select">
            <summary><span class="multi-select-value">All</span></summary>
            <div class="multi-select-menu" role="group" aria-label="Sources">
              <div class="multi-select-options"></div>
              <button type="button" class="link-button multi-select-clear">Show all</button>
            </div>
          </details>
        </div>
        <div class="filter">
          Ticket
          <details id="filter-ticket" class="multi-select">
            <summary><span class="multi-select-value">All</span></summary>
            <div class="multi-select-menu" role="group" aria-label="Tickets">
              <div class="multi-select-options"></div>
              <button type="button" class="link-button multi-select-clear">Show all</button>
            </div>
          </details>
        </div>
        <details id="usage" class="multi-select usage" hidden>
          <summary title="Plan usage"><span class="usage-compact"></span></summary>
          <div class="multi-select-menu usage-panel" role="group" aria-label="Plan usage"></div>
        </details>
        <details id="settings" class="multi-select settings">
          <summary title="Settings" aria-label="Settings"><span class="settings-icon" aria-hidden="true"></span></summary>
          <div class="multi-select-menu settings-panel" role="group" aria-label="Settings">
            <section class="settings-section">
              <h3>Theme</h3>
              <div id="theme" role="radiogroup" aria-label="Theme">
                <div class="multi-select-option"><label><input type="radio" name="theme" value="system" checked />Match macOS</label></div>
                <div class="multi-select-option"><label><input type="radio" name="theme" value="light" />Light</label></div>
                <div class="multi-select-option"><label><input type="radio" name="theme" value="dark" />Dark</label></div>
              </div>
            </section>
            <section id="notifications" class="settings-section" aria-label="Notifications">
              <h3>Notifications</h3>
              <div class="multi-select-option">
                <label><input type="checkbox" data-setting="usageAlerts" />Limit nearly used up</label>
                <select class="settings-select" data-setting="closePercent" aria-label="Alert when a limit is this much used">
                  <option value="80">at 80%</option>
                  <option value="90">at 90%</option>
                  <option value="95">at 95%</option>
                </select>
              </div>
              <div class="multi-select-option"><label><input type="checkbox" data-setting="spareAlerts" />Weekly room about to reset unused</label></div>
              <div class="multi-select-option"><label title="Two working sessions share a worktree or branch"><input type="checkbox" data-setting="sharedAlerts" />Possible concurrent work</label></div>
              <div class="multi-select-option"><label title="Two working sessions edited the same files"><input type="checkbox" data-setting="conflictAlerts" />Overlapping file edits</label></div>
              <div class="multi-select-option">
                <label><input type="checkbox" data-setting="quietHours" />Quiet hours</label>
                <select class="settings-select hour-select" data-setting="quietFrom" aria-label="Quiet from"></select>
                <span class="settings-range">–</span>
                <select class="settings-select hour-select" data-setting="quietTo" aria-label="Quiet until"></select>
              </div>
              <div class="multi-select-option settings-indent"><label><input type="checkbox" data-setting="quietWeekends" />And all weekend</label></div>
              <div id="notifications-actions" class="settings-actions">
                <button id="notifications-test" class="settings-button" type="button">Send a test</button>
                <button id="notifications-settings" class="settings-button" type="button" title="Allow Agent Hub and choose banners or alerts">macOS settings ↗</button>
              </div>
              <p id="notifications-status" class="usage-note" role="status" aria-live="polite"></p>
            </section>
            <section id="hooks" class="settings-section" aria-label="Live status" hidden>
              <h3><label class="switch-label">Live status <input type="checkbox" role="switch" id="hooks-toggle" class="switch" /></label><span class="hooks-value"></span></h3>
              <div class="hooks-panel"></div>
            </section>
            <section class="settings-section">
              <h3>Keep idle sessions</h3>
              <div id="keep-days" role="radiogroup" aria-label="Keep idle sessions">
                <div class="multi-select-option"><label><input type="radio" name="keep-days" value="14" />2 weeks</label></div>
                <div class="multi-select-option"><label><input type="radio" name="keep-days" value="45" checked />45 days</label></div>
                <div class="multi-select-option"><label><input type="radio" name="keep-days" value="90" />90 days</label></div>
              </div>
              <p class="usage-note">Since your last prompt. Running sessions, and ones you moved out of Parked or gave a ticket or notes, always stay.</p>
            </section>
          </div>
        </details>
      </header>
      <div id="errors" class="errors" hidden></div>
    </div>
    <div class="workspace">
      <main id="board" class="board"></main>
    </div>
    <dialog id="card-details" class="card-details" aria-labelledby="details-title" aria-modal="true">
      <header class="details-header">
        <h2 id="details-title" spellcheck="false"></h2>
        <button id="details-close" class="icon-button" type="button" aria-label="Close session details" title="Close (Esc)">×</button>
      </header>
      <div id="details-badges" class="details-badges"></div>
      <div class="details-overview">
        <dl id="details-meta" class="details-meta">
          <dt>Project</dt><dd id="details-project"></dd>
          <dt>Folder</dt><dd id="details-folder"></dd>
          <dt>Branch</dt><dd id="details-branch"></dd>
          <dt>Ticket</dt><dd id="details-ticket"></dd>
          <dt>Column</dt><dd id="details-column"></dd>
        </dl>
        <div class="details-actions">
          <button id="details-session" class="details-action" type="button"></button>
          <button id="details-editor" class="details-action" type="button" title="Open project in VS Code">Open in editor ↗</button>
        </div>
      </div>
      <div class="notes-heading">
        <label for="details-notes">Notes</label>
        <span id="notes-status" role="status" aria-live="polite"></span>
        <button id="notes-retry" class="link-button" type="button" hidden>Retry</button>
      </div>
      <textarea id="details-notes" maxlength="20000" placeholder="Add a note…" aria-describedby="notes-status"></textarea>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
