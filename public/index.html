<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="top">
      <header class="toolbar">
        <span id="summary" class="summary" aria-live="polite"></span>
        <div class="filter">
          Repo
          <details id="filter-repo" class="multi-select">
            <summary><span class="multi-select-value">All</span></summary>
            <div class="multi-select-menu" role="group" aria-label="Repos">
              <button type="button" class="link-button multi-select-clear">Show all</button>
              <div class="multi-select-options"></div>
            </div>
          </details>
        </div>
        <div class="filter">
          Source
          <details id="filter-source" class="multi-select">
            <summary><span class="multi-select-value">All</span></summary>
            <div class="multi-select-menu" role="group" aria-label="Sources">
              <button type="button" class="link-button multi-select-clear">Show all</button>
              <div class="multi-select-options"></div>
            </div>
          </details>
        </div>
        <div class="filter">
          Ticket
          <details id="filter-ticket" class="multi-select">
            <summary><span class="multi-select-value">All</span></summary>
            <div class="multi-select-menu" role="group" aria-label="Tickets">
              <button type="button" class="link-button multi-select-clear">Show all</button>
              <div class="multi-select-options"></div>
            </div>
          </details>
        </div>
        <details id="usage" class="multi-select usage" hidden>
          <summary title="Plan usage"><span class="usage-compact"></span></summary>
          <div class="multi-select-menu usage-panel" role="group" aria-label="Plan usage"></div>
        </details>
        <details id="hooks" class="multi-select hooks" hidden>
          <summary title="Status from Claude and Codex hooks"><span class="hooks-value">Live status</span></summary>
          <div class="multi-select-menu hooks-panel" role="group" aria-label="Live status"></div>
        </details>
      </header>
      <div id="errors" class="errors" hidden></div>
    </div>
    <div class="workspace">
      <main id="board" class="board"></main>
    </div>
    <dialog id="card-details" class="card-details" aria-labelledby="details-title" aria-modal="true">
      <header class="details-header">
        <h2 id="details-title"></h2>
        <button id="details-close" class="icon-button" type="button" aria-label="Close session details" title="Close (Esc)">×</button>
      </header>
      <div id="details-badges" class="details-badges"></div>
      <div class="details-overview">
        <dl id="details-meta" class="details-meta"></dl>
        <div class="details-actions">
          <button id="details-session" class="details-action" type="button"></button>
          <button id="details-editor" class="details-action" type="button" title="Open project in VS Code">Open in editor ↗</button>
        </div>
      </div>
      <div class="notes-heading">
        <label for="details-notes">Notes</label>
        <span id="notes-status" role="status" aria-live="polite"></span>
        <button id="notes-retry" class="link-button" type="button" hidden>Retry</button>
      </div>
      <textarea id="details-notes" maxlength="20000" placeholder="Add a note…" aria-describedby="notes-status"></textarea>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
