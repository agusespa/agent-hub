<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a35" />
      <stop offset="1" stop-color="#1b1b19" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- macOS icon grid: an 824px body centred on the 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3" />

  <!-- The hub, six agents around it, and two smaller agents off each of those -->
  <g stroke="#ecece8" stroke-opacity="0.18" stroke-width="8">
    <line x1="512" y1="512" x2="512" y2="337" />
    <line x1="512" y1="512" x2="664" y2="424" />
    <line x1="512" y1="512" x2="664" y2="600" />
    <line x1="512" y1="512" x2="512" y2="687" />
    <line x1="512" y1="512" x2="360" y2="600" />
    <line x1="512" y1="512" x2="360" y2="424" />
    <line x1="512" y1="337" x2="438" y2="237" />
    <line x1="512" y1="337" x2="586" y2="237" />
    <line x1="664" y1="424" x2="714" y2="310" />
    <line x1="664" y1="424" x2="787" y2="438" />
    <line x1="664" y1="600" x2="787" y2="586" />
    <line x1="664" y1="600" x2="714" y2="714" />
    <line x1="512" y1="687" x2="586" y2="787" />
    <line x1="512" y1="687" x2="438" y2="787" />
    <line x1="360" y1="600" x2="310" y2="714" />
    <line x1="360" y1="600" x2="237" y2="586" />
    <line x1="360" y1="424" x2="237" y2="438" />
    <line x1="360" y1="424" x2="310" y2="310" />
  </g>
  <g fill="#e08a62">
    <circle cx="512" cy="337" r="44" />
    <circle cx="664" cy="600" r="44" />
    <circle cx="360" cy="600" r="44" />
  </g>
  <g fill="#5ea0f2">
    <circle cx="664" cy="424" r="44" />
    <circle cx="512" cy="687" r="44" />
    <circle cx="360" cy="424" r="44" />
  </g>
  <g fill="#e08a62">
    <circle cx="586" cy="237" r="25" />
    <circle cx="787" cy="586" r="25" />
    <circle cx="438" cy="787" r="25" />
    <circle cx="237" cy="438" r="25" />
  </g>
  <g fill="#5ea0f2">
    <circle cx="714" cy="310" r="25" />
    <circle cx="714" cy="714" r="25" />
    <circle cx="310" cy="714" r="25" />
    <circle cx="310" cy="310" r="25" />
  </g>
  <g fill="#94948f">
    <circle cx="787" cy="438" r="25" />
    <circle cx="586" cy="787" r="25" />
    <circle cx="237" cy="586" r="25" />
    <circle cx="438" cy="237" r="25" />
  </g>
  <circle cx="512" cy="512" r="82" fill="#ecece8" />
</svg>
