<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161b" />
      <stop offset="1" stop-color="#0a0c0f" />
    </linearGradient>
    <!-- sRGB: in the default linearRGB the dark gradient comes out banded -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- macOS icon grid: an 824px body centred on the 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3" />

  <!-- The hub's live light with two orbits round it, and an agent on the outer one that needs you -->
  <g fill="none" stroke-width="8">
    <path d="M732.4 370.3A262 262 0 1 1 653.7 291.6" stroke="#e6e8eb" stroke-opacity="0.18" />
    <circle cx="512" cy="512" r="178" stroke="#4de1c1" stroke-opacity="0.4" />
  </g>
  <circle cx="512" cy="512" r="116" fill="#4de1c1" fill-opacity="0.16" />
  <circle cx="512" cy="512" r="76" fill="#4de1c1" />
  <circle cx="697.3" cy="326.7" r="51" fill="#e6a640" fill-opacity="0.2" />
  <circle cx="697.3" cy="326.7" r="30" fill="#e6a640" />
</svg>
